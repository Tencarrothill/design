<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- swiper 작동 선언 ㄱ -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.css">
    <script src="js/jquery-3.7.1.min.js"></script>
    <script src="js/main.js"></script>
    <link rel="stylesheet" href="css/main.css">
    <title>금호건설</title>
</head>
<body>
    <div id="wrap">
        <header></header>
        <main class="container">
            <section class="visual">
                <h2>Visual Pop-up</h2> <!-- css에서 display none 처리 될테지만 이 section 전체를 아우르는 제목이다. -->
                <div class="swiper">
                    <ul class="swiper-wrapper">
                        <li class="swiper-slide bg1">
                            <h3>KUMHO E&C<br>THINK OF THE<br>PEOPLE AND NATURE</h3>
                            <p>금호건설은 아름다운 미래를 건설합니다</p>
                            <div class="bar"></div>
                        </li>
                        <li class="swiper-slide bg2">
                            <h3>KUMHO CONSTRUCTION<br>IS THE CONSTRUCTION OF<br>EXPORT WAVE</h3>
                            <p>금호건설은 건설업계 최고의 기술력을 자랑하고 있는 기업입니다.</p>
                            <div class="bar"></div>
                        </li>
                        <li class="swiper-slide bg3">
                            <h3>WILL CHALLENGE<br>THE WORLD'S BEST</h3>
                            <p>세계로 뻗어가는 건설 한류의 중심에 금호건설이 있습니다</p>
                            <div class="bar"></div>
                        </li>
                    </ul>
                    <div class="btn_wrap">
                        <div class="paging"></div>
                        <button class="btn_prev">이전팝업</button>
                        <button class="btn_next">다음팝업</button>
                        <button class="btn_stop">팝업정지</button>
                        <button class="btn_play">팝업재생</button>
                    </div><!--btn_wrap-->
                </div><!--swiper-->
            </section><!--visual-->
            <section class="biz"></section><!--biz-->
            <section class="news"></section><!--news-->
            <section class="service"></section><!--service-->
        </main><!--container-->
        <footer></footer>
    </div><!--wrap-->
</body>
</html>
