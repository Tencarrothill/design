                                    <li><a href="#n">당일 피크닉</a></li>
                                    <li><a href="#n">소형견 글램핑</a></li>
                                    <li><a href="#n">대형견 글램핑</a></li>
                                </ul>

        <main class="container" id="skip_contents">
            <section class="visual">
                <h2>popup</h2>
                <div class="swiper">
                    <ul class="swiper-wrapper">
                        <li class="swiper-slide popup01">
                            <div class="wrapper"><h3>사랑하는 반려견과 함께<br>달콤한 추억을</h3></div>

                        <li class="swiper-slide popup04">
                            <div class="wrapper"><h3>당일 피크닉으로도<br>맛볼 수 있는 행복</h3></div>

                    </ul>
                    <div class="btn_wrap">

                        <button class="pause">정지</button>
                        <button class="play">재생</button>
                    </div>
